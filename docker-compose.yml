version: '3.9'

services:
  postgres:
    image: postgres:14
    container_name: pg-mastery
    environment:
      - POSTGRES_DB=mastery
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:6
    container_name: mongo-mastery
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7
    container_name: redis-mastery
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  mongodata:
  redisdata: